<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Gaúcho</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#071611;color:#f4f3e8;font-family:Arial,sans-serif}.cash{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#31582a 0,transparent 34%),linear-gradient(135deg,#06110c,#111d0e 55%,#050807)}.top{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0 16px;border-bottom:1px solid #d7b94b44}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:#f6cf4f;text-shadow:0 0 20px #f6cf4f55}.brand small{display:block;margin-top:5px;color:#b9c4a8;font-size:10px;letter-spacing:1px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.controls label{font-size:11px;color:#d7dfc7;text-transform:uppercase;letter-spacing:1px}.controls input,.controls select,.controls button{height:39px;border:1px solid #8c7834;border-radius:8px;background:#101d13;color:#fff;padding:0 10px;font-weight:bold}.controls input{width:78px}.controls button{background:linear-gradient(135deg,#f9d457,#c39122);color:#201600;border:0;cursor:pointer}.controls button:disabled{opacity:.55;cursor:wait}.game{max-width:1200px;margin:18px auto}.status{min-height:22px;text-align:center;color:#d8d4bd;font-size:13px;margin:8px}.arena{position:relative;min-height:650px;padding:65px 22px 24px;overflow:hidden;border:2px solid #9b8636;border-radius:24px;background:repeating-linear-gradient(0deg,transparent 0 37px,#ffffff05 38px),radial-gradient(ellipse at center,#2d5627,#122513 58%,#07100a);box-shadow:inset 0 0 90px #0009,0 20px 55px #0008}.arena:before{content:'CASH GAÚCHO';position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff2;font-size:clamp(22px,4vw,42px);font-weight:900;letter-spacing:7px;white-space:nowrap}.targets{position:relative;z-index:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px;max-width:1000px;margin:auto}.target{position:relative;aspect-ratio:1;border:1px solid #cfb253;border-radius:8px;background:linear-gradient(145deg,#496d31,#1a351b);box-shadow:inset 0 2px 0 #ffffff22,0 4px 8px #0008;color:#fff;font-size:clamp(13px,2vw,25px);cursor:pointer;transition:transform .2s,filter .2s,background .3s}.target:hover:not(:disabled){transform:translateY(-4px) scale(1.08);filter:brightness(1.18)}.target:disabled{cursor:default}.target.reveal{background:linear-gradient(145deg,#f8df75,#b77b18);border-color:#fff3b2;color:#1b1606;transform:scale(1.1);z-index:2;animation:reveal .7s ease both}.target.reveal .symbol{display:none}.target .name{display:none;position:absolute;inset:3px;align-content:center;overflow:hidden;font-size:clamp(7px,1.15vw,12px);font-weight:900;line-height:1.05;text-align:center;word-break:break-word}.target.reveal .name{display:grid}@keyframes reveal{0%{transform:scale(.4) rotate(-15deg);filter:brightness(2)}70%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1.1)}}.cannon{position:absolute;z-index:4;bottom:19px;left:24px;width:85px;height:46px;border-radius:0 28px 28px 0;background:linear-gradient(#d6bc61,#726019);border:4px solid #332b0d;transform:rotate(-12deg);box-shadow:0 7px 12px #0009}.cannon:after{content:'';position:absolute;left:-20px;bottom:-15px;width:45px;height:16px;border-radius:50%;background:#19170c;border:4px solid #86702b}.shot{position:absolute;z-index:5;width:18px;height:18px;border-radius:50%;background:#fff4a1;box-shadow:0 0 13px 6px #f5c940;pointer-events:none;animation:shot .7s cubic-bezier(.2,.7,.4,1) forwards}@keyframes shot{from{left:82px;bottom:48px;opacity:1;transform:scale(.5)}to{left:var(--x);top:var(--y);opacity:0;transform:scale(1.5)}}.winner{position:absolute;inset:0;z-index:8;display:none;place-items:center;padding:20px;background:#000b;backdrop-filter:blur(5px)}.winner.show{display:grid}.winner-card{width:min(100%,480px);padding:30px;border:1px solid #f2d368;border-radius:22px;background:linear-gradient(145deg,#293a1c,#0d160c);box-shadow:0 0 60px #efc54766;text-align:center}.winner-card h2{margin:0 0 15px;color:#f5d04c;letter-spacing:2px}.winner-names{margin:0 0 18px;color:#fff;font-size:20px;font-weight:800;line-height:1.55}.winner-card p{color:#cbd3bd;font-size:13px}.winner-card button{border:0;border-radius:8px;padding:11px 17px;background:#f5d04c;color:#1e1603;font-weight:bold;cursor:pointer}@media(max-width:700px){.arena{min-height:570px;padding:58px 10px 18px}.targets{gap:4px}.target{border-radius:5px}.cannon{transform:scale(.7) rotate(-12deg);transform-origin:left bottom}.controls{gap:6px}.controls input,.controls select,.controls button{height:36px;padding:0 7px}.brand{font-size:18px}}
    /* Camada visual premium */
    .cash{position:relative;isolation:isolate;background:radial-gradient(circle at 16% 10%,#7e9d3b44,transparent 21%),radial-gradient(circle at 84% 85%,#e5b53526,transparent 24%),linear-gradient(135deg,#030704,#112212 52%,#060b06)}
    .cash:before,.cash:after{content:'';position:fixed;z-index:-1;width:45vw;aspect-ratio:1;border:1px solid #f5d45b22;border-radius:50%;pointer-events:none}.cash:before{top:-27vw;left:-16vw;box-shadow:0 0 0 50px #f5d45b06,0 0 0 110px #f5d45b04}.cash:after{right:-21vw;bottom:-30vw;box-shadow:0 0 0 65px #6aac5833,0 0 0 135px #6aac5814}.top{position:relative;padding:16px 18px;border:1px solid #d7b94b55;border-radius:18px;background:linear-gradient(105deg,#0e1d11d9,#172b16b5);box-shadow:inset 0 1px #fff2,0 14px 40px #0007}.brand{display:flex;align-items:center;gap:10px;font-size:25px}.brand:before{content:'$';display:grid;place-items:center;width:38px;height:38px;border:2px solid #f7d663;border-radius:50%;background:#5c782d;color:#fff5b4;font-size:23px;box-shadow:0 0 20px #f7d66355}.brand small{margin-left:48px}.controls{padding:7px 9px;border:1px solid #f5d66b22;border-radius:12px;background:#02060266}.controls label{display:flex;align-items:center;gap:7px}.controls select,.controls input{background:#0b160c;border-color:#d2b54f88;box-shadow:inset 0 1px 4px #000}.controls button{position:relative;overflow:hidden;box-shadow:0 6px 18px #d99d253d;transition:transform .2s,filter .2s}.controls button:hover{transform:translateY(-2px);filter:brightness(1.12)}.controls button:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff8 50%,transparent 70%);transform:translateX(-120%);transition:transform .5s}.controls button:hover:before{transform:translateX(120%)}.status{width:max-content;max-width:100%;margin:14px auto;padding:8px 15px;border:1px solid #e2c25755;border-radius:999px;background:#071008cf;box-shadow:0 6px 20px #0005;color:#f3e7b5}.arena{border-color:#d9bc4e;border-radius:28px;background:linear-gradient(#0b1a0bcc,#0b160bd9),repeating-linear-gradient(90deg,transparent 0 45px,#f4d96408 46px),radial-gradient(ellipse at center,#4b7b35,#102711 59%,#030704);box-shadow:inset 0 0 0 1px #fff1,inset 0 0 110px #000d,0 26px 55px #0009}.arena:after{content:'';position:absolute;inset:10px;border:1px solid #f4d9641f;border-radius:20px;pointer-events:none}.targets{padding:13px;border:1px solid #efd2692e;border-radius:18px;background:#0207024d;box-shadow:inset 0 0 30px #0008}.target{isolation:isolate;overflow:hidden;border:1px solid #e5ca6b;background:radial-gradient(circle at 38% 27%,#91af4f,#426e32 42%,#1a351b 76%);box-shadow:inset 0 1px #fff5,inset 0 -7px 10px #03100399,0 4px 9px #0009}.target:before{content:'';position:absolute;z-index:-1;inset:15%;border:1px solid #fff7;border-radius:50%;box-shadow:0 0 0 3px #17331766,0 0 0 5px #f6d15b33}.target:after{content:'';position:absolute;z-index:-1;inset:32%;border-radius:50%;background:#f5d55c55;box-shadow:0 0 10px #ffe98755}.target:hover:not(:disabled){box-shadow:inset 0 1px #fff9,0 0 0 2px #ffe991,0 0 19px #f5d55c99,0 8px 12px #0009}.target .symbol{position:relative;z-index:1;filter:drop-shadow(0 2px 1px #0009)}.target.reveal{background:radial-gradient(circle at 40% 30%,#fff5aa,#dca52c 48%,#7b4d0d);box-shadow:0 0 0 3px #fff6b5,0 0 34px #f7d84b,0 12px 20px #000}.cannon{bottom:28px;left:29px;background:linear-gradient(160deg,#f5d971,#a36a18 55%,#4a310c);box-shadow:inset 0 2px #fff7,0 8px 16px #000}.cannon:before{content:'CASH';position:absolute;right:6px;top:10px;color:#382307;font-size:9px;font-weight:900;letter-spacing:1px}.winner-card{position:relative;overflow:hidden;border-color:#ffe47e;background:radial-gradient(circle at 50% 0,#607d34,#172814 62%,#091008);box-shadow:0 0 0 6px #f3d5581c,0 0 75px #f2ca4077}.winner-card:before{content:'';position:absolute;inset:-60%;background:conic-gradient(transparent,#ffe98822,transparent 30%);animation:shine 4s linear infinite}.winner-card>*{position:relative}@keyframes shine{to{transform:rotate(1turn)}}
    .target:before,.target:after{z-index:0}.target .symbol{position:relative;z-index:1}.target .name{z-index:1}
    .cannon{z-index:6;width:108px;height:52px;bottom:25px;left:30px;border:3px solid #2b220c;border-radius:18px 34px 16px 13px;background:linear-gradient(150deg,#e8c85e 0%,#9c6817 48%,#4b300b 100%);box-shadow:inset 3px 3px #fff4,inset -7px -8px #28180599,0 10px 14px #000a;transform:rotate(-8deg)}.cannon:before{content:'CASH';right:12px;top:18px;color:#2d1a04;font:900 10px Arial;letter-spacing:1.5px;text-shadow:0 1px #fff5}.cannon:after{left:18px;bottom:-17px;width:72px;height:14px;border:3px solid #251b08;border-radius:50%;background:#554016;box-shadow:inset 0 3px #b19538,0 5px 5px #0008}.cannon-barrel{position:absolute;right:55px;top:-34px;width:116px;height:30px;border:4px solid #2d2109;border-radius:9px 3px 3px 9px;background:linear-gradient(#f5d66d 0 18%,#b77b1b 19% 61%,#5d3c0c 62%);box-shadow:inset 0 2px #fff6,0 6px 8px #0008;transform:rotate(-16deg);transform-origin:right bottom}.cannon-barrel:after{content:'';position:absolute;left:9px;top:6px;width:73px;height:4px;border-radius:99px;background:#fff5b8aa;box-shadow:0 7px #5b390c88}.cannon-muzzle{position:absolute;right:157px;top:-65px;width:30px;height:38px;border:4px solid #332408;border-radius:9px;background:radial-gradient(circle,#fff4a5 0 15%,#d39422 20% 42%,#4c310a 48%);box-shadow:0 0 15px #f5cc4088;transform:rotate(-16deg)}.cannon-wheel{position:absolute;bottom:-27px;width:31px;height:31px;border:4px solid #221a08;border-radius:50%;background:radial-gradient(circle,#e8c657 0 14%,#38270b 17% 38%,#161207 41%);box-shadow:inset 0 0 0 3px #987525,0 5px 5px #0008}.cannon-wheel-one{left:18px}.cannon-wheel-two{right:14px}.arena:has(.shot) .cannon{animation:cannon-recoil .22s ease-in-out 2}@keyframes cannon-recoil{50%{transform:rotate(-8deg) translate(-10px,6px)}}
    .cannon-barrel{left:45px;right:auto;top:-42px;transform:rotate(-42deg);transform-origin:left bottom}.cannon-muzzle{left:143px;right:auto;top:-111px;transform:rotate(-42deg)}
    @media(max-width:700px){.top{padding:13px}.brand{font-size:20px}.brand small{margin-left:0}.controls{width:100%;justify-content:center}.targets{padding:7px}.target:before{inset:11%}.target:after{inset:29%}}
  </style>
</head>
<body>
  <main class="cash">
    <header class="top"><div class="brand">✹ CASH GAÚCHO<small>Escolha o alvo antes que o tempo acabe</small></div><div class="controls"><label>Vencedores <select id="winner-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><label>Gorjeta <input id="amount" type="number" min="0.01" step="0.01" value="20.00" /></label><button id="prepare">Embaralhar alvos</button></div></header>
    <section class="game"><div id="status" class="status">Carregando participantes...</div><div id="arena" class="arena"><div id="targets" class="targets"></div><div class="cannon" aria-hidden="true"><span class="cannon-barrel"></span><span class="cannon-muzzle"></span><span class="cannon-wheel cannon-wheel-one"></span><span class="cannon-wheel cannon-wheel-two"></span></div><div id="winner" class="winner"><div class="winner-card"><h2>✦ VENCEDOR(ES) ✦</h2><div id="winner-names" class="winner-names"></div><p id="winner-tip"></p><button id="close">Nova rodada</button></div></div></div></section>
  </main>
  <script type="module">
    import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from './config.js';
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));let members=[],targets=[],winners=[],running=false,deadline;
    const symbols=['🍀','💎','⭐','🎯','🪙','🔥','⚡','🌵','🧨','🎲','🦅','🍺'];const shuffle=a=>[...a].sort(()=>Math.random()-.5);const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function load(){const{data,error}=await supabase.from('members').select('id,full_name,twitch_nick,created_at').order('created_at');members=data||[];$('#status').textContent=error?'Não foi possível carregar os membros.':`${members.length} participante(s) pronto(s). Embaralhe os 108 alvos para começar.`}
    function prepare(){if(running)return;if(!members.length){$('#status').textContent='Cadastre ao menos um membro antes de jogar.';return}winners=[];const count=Math.min(Number($('#winner-count').value),members.length),pool=shuffle(members);targets=Array.from({length:108},(_,i)=>({member:pool[i%pool.length],symbol:symbols[Math.floor(Math.random()*symbols.length)],used:false}));render();deadline=Date.now()+15000;$('#status').textContent=`Escolha um alvo — 15 segundos para encontrar ${count} vencedor(es).`;clearInterval(window.cashTimer);window.cashTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(left>0){$('#status').textContent=`Escolha um alvo — ${left}s restantes • ${winners.length}/${count} vencedor(es).`}else{clearInterval(window.cashTimer);finish()}},250)}
    function render(){const box=$('#targets');box.innerHTML='';targets.forEach((target,index)=>{const el=document.createElement('button');el.className='target';el.type='button';el.dataset.index=index;el.innerHTML=`<span class="symbol">${target.symbol}</span><span class="name">${esc(target.member.full_name)}</span>`;el.addEventListener('click',()=>choose(index,el));box.append(el)})}
    async function choose(index,el){const count=Math.min(Number($('#winner-count').value),members.length);if(running||targets[index].used||winners.some(winner=>winner.id===targets[index].member.id)||winners.length>=count)return;running=true;targets[index].used=true;document.querySelectorAll('.target').forEach(b=>b.disabled=true);const arena=$('#arena').getBoundingClientRect(),rect=el.getBoundingClientRect(),shot=document.createElement('i');shot.className='shot';shot.style.setProperty('--x',`${rect.left-arena.left+rect.width/2}px`);shot.style.setProperty('--y',`${rect.top-arena.top+rect.height/2}px`);$('#arena').append(shot);await sleep(650);shot.remove();el.classList.add('reveal');winners.push(targets[index].member);await sleep(900);if(winners.length>=count)finish();else{running=false;document.querySelectorAll('.target:not(.reveal)').forEach(b=>{const target=targets[Number(b.dataset.index)];b.disabled=winners.some(winner=>winner.id===target.member.id)});$('#status').textContent=`Alvo acertado! Escolha o próximo — ${winners.length}/${count} vencedor(es).`}}
    async function finish(){clearInterval(window.cashTimer);document.querySelectorAll('.target').forEach(b=>b.disabled=true);if(!winners.length){$('#status').textContent='Tempo esgotado — nenhum alvo foi escolhido.';running=false;return}running=true;const amount=Number($('#amount').value);if(!Number.isFinite(amount)||amount<=0){$('#status').textContent='Informe um valor de gorjeta válido.';running=false;return}let ok=true;for(const m of winners){let{error}=await supabase.from('tips').insert({member_id:m.id,amount,source:'cash_gaucho'});if(error)({error}=await supabase.from('tips').insert({member_id:m.id,amount,source:'members'}));if(error)ok=false}$('#winner-names').innerHTML=winners.map(m=>esc(m.full_name)).join('<br>');$('#winner-tip').textContent=ok?`R$ ${amount.toFixed(2).replace('.',',')} registrado para cada vencedor.`:'Os vencedores foram definidos, mas ocorreu um erro ao registrar uma gorjeta.';$('#winner').classList.add('show');$('#status').textContent='Rodada encerrada.';running=false}
    $('#prepare').addEventListener('click',prepare);$('#close').addEventListener('click',()=>{$('#winner').classList.remove('show');prepare()});load();
  </script>
</body>
</html>

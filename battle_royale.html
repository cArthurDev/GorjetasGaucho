<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Royale | Gorjetas do Gaúcho</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#090909;color:#f8f5ec;font-family:Arial,sans-serif}.game{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 35%,#29351a 0,#11170e 35%,#090909 75%)}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid rgba(255,205,63,.25);padding-bottom:14px}.brand{font-weight:900;letter-spacing:1.5px;color:#ffcf45}.brand small{display:block;color:#aaa;font-size:10px;margin-top:4px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls input,.controls button{height:38px;border-radius:8px;border:1px solid #4b513d;background:#141811;color:#fff;padding:0 11px;font-weight:bold}.controls input{width:92px}.controls button{cursor:pointer}.controls .start{background:#ffcb3d;color:#171300;border-color:#ffcb3d}.main{max-width:1100px;margin:20px auto}.status{text-align:center;color:#b9b9ae;font-size:13px;min-height:20px;margin:10px}.arena{position:relative;min-height:560px;overflow:hidden;border:2px solid #6d7e3e;border-radius:22px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 16px),radial-gradient(circle at center,#384c24,#172113 55%,#10160d);box-shadow:inset 0 0 100px #0008}.arena:before{content:'BATTLE ROYALE';position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:clamp(19px,3vw,32px);font-weight:900;letter-spacing:4px;color:#fff2;white-space:nowrap}.fighter{position:absolute;width:78px;text-align:center;transition:transform .55s ease,opacity .55s ease,filter .55s ease;z-index:1}.fighter.eliminated{opacity:0;transform:scale(.2) rotate(160deg)!important;filter:grayscale(1)}.avatar{width:48px;height:48px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,#ffe478,#be7a13);color:#191205;border:3px solid #fff1b0;font-weight:900;box-shadow:0 0 0 4px #0007,0 4px 13px #0009}.fighter-name{font-size:10px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px;text-shadow:0 1px 3px #000}.round{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#10130ddd;border:1px solid #ffcf45aa;border-radius:999px;padding:9px 15px;color:#ffdb6a;font-size:12px;font-weight:bold;z-index:2}.winner{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#000b;z-index:5}.winner.visible{display:grid}.winner-card{padding:30px;max-width:380px;width:90%;border-radius:20px;border:2px solid #ffcf45;background:#17140d;box-shadow:0 0 70px #ffcf4566}.winner-card h2{color:#ffcf45;margin:0 0 12px}.winner-avatar{font-size:45px;font-weight:bold;color:#fff}.winner-card p{color:#c7c2b4}.winner-card button{border:0;border-radius:8px;padding:11px 18px;background:#ffcf45;color:#171300;font-weight:bold;cursor:pointer}@media(max-width:600px){.arena{min-height:500px}.fighter{width:62px}.avatar{width:40px;height:40px}.fighter-name{font-size:8px}}
  </style>
</head>
<body>
  <div class="game">
    <header class="top"><div class="brand">⚔ BATTLE ROYALE<small>Último membro na arena vence</small></div><div class="controls"><label>Gorjeta <input id="amount" type="number" min="0.01" step="0.01" value="20.00" /></label><button id="refresh">Atualizar membros</button><button id="start" class="start">Iniciar batalha</button></div></header>
    <main class="main"><div id="status" class="status">Carregando membros...</div><section id="arena" class="arena"><div id="round" class="round">Aguardando batalha</div><div id="winner" class="winner"><div class="winner-card"><h2>🏆 VENCEDOR</h2><div id="winner-avatar" class="winner-avatar"></div><h3 id="winner-name"></h3><p id="winner-tip"></p><button id="close">Fechar resultado</button></div></div></section></main>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const arena=document.querySelector('#arena'),status=document.querySelector('#status'),round=document.querySelector('#round'),start=document.querySelector('#start'),amount=document.querySelector('#amount'),winnerBox=document.querySelector('#winner');
    let members=[],alive=[],running=false;
    const initials=name=>name.trim().split(/\s+/).slice(0,2).map(word=>word[0]).join('').toUpperCase();
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function render(){arena.querySelectorAll('.fighter').forEach(node=>node.remove());alive.forEach((member,index)=>{const node=document.createElement('div');node.className='fighter';node.dataset.id=member.id;node.innerHTML=`<div class="avatar">${escapeHtml(initials(member.full_name))}</div><div class="fighter-name">${escapeHtml(member.full_name)}</div>`;arena.append(node);move(node,index,alive.length);});}
    function move(node,index,total){const cols=Math.max(3,Math.ceil(Math.sqrt(total*1.5)));const x=7+(index%cols)*(86/Math.max(cols-1,1));const y=17+Math.floor(index/cols)*(65/Math.max(Math.ceil(total/cols)-1,1));node.style.left=`${x}%`;node.style.top=`${y}%`;node.style.transform='translate(-50%, -50%)';}
    async function load(){if(running)return;status.textContent='Carregando membros...';const {data,error}=await supabase.from('members').select('id,full_name,twitch_nick,created_at').order('created_at',{ascending:true});if(error){status.textContent='Não foi possível carregar os membros.';return;}members=data||[];status.textContent=`${members.length} participante(s) pronto(s) para a arena.`;alive=[...members];render();}
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    async function registerWinner(member,value){const tip={member_id:member.id,amount:value,source:'battle_royale'};let {error}=await supabase.from('tips').insert(tip);if(error&&(error.code==='23514'||error.code==='22P02')){console.warn('A origem Battle Royale ainda não é aceita pelo banco; registrando como gorjeta de membro.',error);({error}=await supabase.from('tips').insert({...tip,source:'members'}));}if(error)throw error;}
    async function battle(){if(running)return;const value=Number(amount.value);if(!Number.isFinite(value)||value<=0){status.textContent='Informe um valor de gorjeta maior que zero.';amount.focus();return;}if(members.length<2){status.textContent='Cadastre pelo menos dois membros para iniciar.';return;}running=true;start.disabled=true;winnerBox.classList.remove('visible');alive=[...members];render();let turn=1;while(alive.length>1){round.textContent=`Rodada ${turn} • ${alive.length} sobreviventes`;await sleep(1200);const removeCount=Math.max(1,Math.floor(alive.length/2));const eliminated=[...alive].sort(()=>Math.random()-.5).slice(0,removeCount);eliminated.forEach(member=>arena.querySelector(`[data-id="${CSS.escape(member.id)}"]`)?.classList.add('eliminated'));alive=alive.filter(member=>!eliminated.includes(member));status.textContent=`${eliminated.length} membro(s) eliminado(s)!`;await sleep(800);render();turn++;}const champion=alive[0];round.textContent='Batalha encerrada';status.textContent='Registrando gorjeta do vencedor...';try{await registerWinner(champion,value);document.querySelector('#winner-avatar').textContent=initials(champion.full_name);document.querySelector('#winner-name').textContent=champion.full_name;document.querySelector('#winner-tip').textContent=`Gorjeta de R$ ${value.toFixed(2).replace('.',',')} registrada.`;winnerBox.classList.add('visible');status.textContent='Vencedor definido!';}catch(error){console.error(error);status.textContent='O vencedor foi definido, mas não foi possível registrar a gorjeta.';}finally{running=false;start.disabled=false;}}
    document.querySelector('#refresh').addEventListener('click',load);start.addEventListener('click',battle);document.querySelector('#close').addEventListener('click',()=>winnerBox.classList.remove('visible'));load();
  </script>
</body>
</html>

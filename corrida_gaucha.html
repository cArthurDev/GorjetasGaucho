<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida Gaúcha</title>
<style>
/* Mesmo fundo-base do login e do painel administrativo. */
body{background:#0b0b0b!important}.app{background:radial-gradient(circle at 70% 0,rgba(200,154,60,.12),transparent 35%),#111!important}.top{background:#151515!important;border-color:#302d27!important;box-shadow:0 14px 40px #0008!important}
.controls select{height:39px;border:1px solid #c9aa4e;border-radius:8px;padding:0 9px;background:#071009;color:#fff;font-weight:bold}
*{box-sizing:border-box}body{margin:0;background:#07120e;color:#fff;font:14px Arial,sans-serif}.app{min-height:100vh;padding:18px;background:radial-gradient(circle at 75% 0,#b78a2835,transparent 30%),linear-gradient(135deg,#06110c,#17291a 55%,#060a08)}.top{max-width:1280px;margin:auto;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid #d7b94b66;border-radius:18px;background:#09140edd}.brand{font-size:24px;font-weight:900;letter-spacing:1px;color:#f5cf55}.brand small{display:block;font-size:10px;color:#c9d0ba;letter-spacing:1px;margin-top:5px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{display:grid;gap:5px;font-size:10px;color:#cbd3bd;text-transform:uppercase;font-weight:bold;letter-spacing:1px}.controls input,.controls button{height:39px;border-radius:8px;padding:0 11px;font-weight:bold}.controls input{width:88px;border:1px solid #c9aa4e;background:#071009;color:#fff}.controls button{border:0;background:linear-gradient(135deg,#f9d457,#bd861d);color:#241903;cursor:pointer}.controls button:disabled{opacity:.55}.status{min-height:38px;max-width:1280px;margin:10px auto;text-align:center;color:#e6d69c;padding:8px}.viewport{position:relative;max-width:1280px;height:min(70vh,680px);min-height:460px;margin:auto;overflow:hidden;border:2px solid #d5b64e;border-radius:24px;background:linear-gradient(#79b7df 0 26%,#b8d9e6 26% 34%,#648b3d 34%);box-shadow:inset 0 0 80px #0006}.sun{position:absolute;top:45px;right:14%;width:70px;height:70px;border-radius:50%;background:#ffe59a;box-shadow:0 0 45px #ffe18a88}.mountains{position:absolute;top:22%;left:-10%;width:130%;height:20%;background:linear-gradient(145deg,transparent 35%,#496f50 36% 49%,transparent 50%) 0/190px 100%,linear-gradient(35deg,transparent 35%,#365d43 36% 49%,transparent 50%) 95px/210px 100%;opacity:.75}.track{position:absolute;inset:34% -35% 8%;min-width:3200px;background:repeating-linear-gradient(90deg,#303437 0 128px,#393d40 128px 256px);transform:perspective(460px) rotateX(28deg);border-top:9px solid #f2ead5;border-bottom:9px solid #f2ead5;box-shadow:0 -16px #b8a038,0 16px #b8a038}.track:before,.track:after{content:'';position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#fff 0 38px,transparent 38px 82px)}.track:before{top:33%}.track:after{top:66%}.line{position:absolute;top:34%;bottom:8%;width:28px;z-index:3;transform:perspective(460px) rotateX(28deg);background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0/14px 14px}.startline{left:3%}.finishline{left:91%}.cars{position:absolute;inset:0;z-index:4}.car{position:absolute;left:4%;width:104px;height:42px;transform:scale(var(--scale,1));transform-origin:left center;will-change:left;filter:drop-shadow(0 7px 4px #0009)}.name{position:absolute;left:50%;bottom:45px;transform:translateX(-50%);width:150px;text-align:center;font-size:11px;font-weight:900;text-shadow:0 2px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{position:absolute;inset:7px 3px 4px;border-radius:16px 20px 10px;background:var(--car);border:2px solid #fff9;box-shadow:inset 0 5px #fff4}.body:before{content:'';position:absolute;left:29px;top:-9px;width:37px;height:17px;border-radius:12px 12px 2px 2px;background:#bce9f0;border:2px solid #fff9}.wheel{position:absolute;bottom:0;width:19px;height:19px;border:4px solid #171717;border-radius:50%;background:#aaa}.wheel:nth-last-child(2){left:13px}.wheel:last-child{right:11px}.car.winner{filter:drop-shadow(0 0 12px #ffe46d)}.car.winner .body{animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.13)}}.modal{position:absolute;inset:0;z-index:8;display:none;place-items:center;padding:20px;background:#000a;backdrop-filter:blur(4px)}.modal.show{display:grid}.card{width:min(100%,480px);padding:32px;border:1px solid #ffe67c;border-radius:22px;background:radial-gradient(circle at 50% 0,#617e37,#172814 63%,#081008);text-align:center;box-shadow:0 0 75px #f3ca4077}.card h2{margin:0 0 15px;color:#ffe172;letter-spacing:2px}.card strong{display:block;font-size:25px;margin:8px}.card p{font-size:13px;color:#d3dcc6}.card button{border:0;border-radius:8px;padding:11px 17px;background:#f5d04c;color:#1e1603;font-weight:bold;cursor:pointer}@media(max-width:650px){.app{padding:9px}.viewport{min-height:520px;height:72vh}.brand{font-size:19px}.controls{width:100%}.controls button{flex:1}.track{inset:29% -50% 7%}.line{top:29%;bottom:7%}.finishline{left:89%}}
</style></head><body><main class="app"><header class="top"><div class="brand">🏎 CORRIDA GAÚCHA<small>Todos os membros entram na pista — você dá a largada</small></div><div class="controls"><label>Gorjeta por vencedor<input id="amount" type="number" min="0.01" step="0.01" value="20.00"></label><button id="reload">Atualizar pilotos</button><button id="start">Dar a largada</button></div></header><div id="status" class="status">Carregando pilotos...</div><section class="viewport"><i class="sun"></i><i class="mountains"></i><i class="track"></i><i class="line startline"></i><i class="line finishline"></i><div id="cars" class="cars"></div><div id="modal" class="modal"><div class="card"><h2>🏁 VENCEDOR DA CORRIDA</h2><strong id="winner-name"></strong><p id="winner-tip"></p><button id="again">Nova corrida</button></div></div></section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),colors=['#d94b43','#2775b9','#e2ad2f','#7d55b3','#e66a2c','#36a16d','#c43872','#168d9c'];let members=[],running=false;const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const pilots=()=>members;
$('.controls').insertAdjacentHTML('afterbegin','<label>Velocidade<select id="race-speed"><option value="13500">Lenta</option><option value="9500" selected>Normal</option><option value="6000">Rápida</option></select></label><label>Ganhadores<select id="winner-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>');
function render(){let list=pilots(),scale=Math.max(.34,Math.min(1,12/Math.max(list.length,1)));$('#cars').innerHTML=list.map((m,i)=>`<div class="car" data-id="${m.id}" style="top:${37+i*(52/Math.max(list.length,1))}%;--car:${colors[i%colors.length]};--scale:${scale}"><span class="name">${esc(m.full_name)}</span><i class="body"></i><i class="wheel"></i><i class="wheel"></i></div>`).join('')}
async function load(){if(running)return;$('#status').textContent='Carregando pilotos...';let{data,error}=await supabase.from('members').select('id,full_name,created_at').order('created_at');members=data||[];render();$('#status').textContent=error?'Não foi possível carregar os membros.':members.length?`${members.length} participante(s) inscrito(s) e pronto(s) para correr.`:'Cadastre ao menos um membro para começar.'}
function run(){if(running||!members.length)return;let amount=Number($('#amount').value),duration=Number($('#race-speed').value),count=Math.min(Number($('#winner-count').value),members.length);if(!Number.isFinite(amount)||amount<=0){$('#status').textContent='Informe um valor de gorjeta válido.';return}running=true;$('#start').disabled=true;$('#modal').classList.remove('show');let list=pilots(),winners=[...list].sort(()=>Math.random()-.5).slice(0,count),began=performance.now(),places=new Map();list.filter(m=>!winners.includes(m)).sort(()=>Math.random()-.5).forEach((m,i)=>places.set(m.id,56+(28*i/Math.max(list.length-count-1,1))));winners.forEach((m,i)=>places.set(m.id,94-(i*.35)));$('#status').textContent=`Largada! ${count} ganhador(es) cruzarão a linha de chegada.`;function frame(now){let raw=Math.min((now-began)/duration,1),p=raw<.82?raw/.82:1,paced=1-Math.pow(1-p,3);list.forEach(m=>{let end=places.get(m.id),position=4+(end-4)*paced,car=document.querySelector(`.car[data-id="${CSS.escape(m.id)}"]`);if(car)car.style.left=`${position}%`});raw<1?requestAnimationFrame(frame):finish(winners,amount)}requestAnimationFrame(frame)}
async function finish(winners,amount){$('#status').textContent='Registrando gorjeta dos ganhadores...';winners.forEach(winner=>document.querySelector(`.car[data-id="${CSS.escape(winner.id)}"]`)?.classList.add('winner'));let failed=false;for(const winner of winners){let{error}=await supabase.from('tips').insert({member_id:winner.id,amount,source:'corrida_gaucha'});if(error)({error}=await supabase.from('tips').insert({member_id:winner.id,amount,source:'members'}));if(error)failed=true}document.querySelector('.card h2').textContent=winners.length>1?'🏁 GANHADORES DA CORRIDA':'🏁 VENCEDOR DA CORRIDA';$('#winner-name').textContent=winners.map(winner=>winner.full_name).join(' • ');$('#winner-tip').textContent=failed?'Os ganhadores foram definidos, mas não foi possível registrar todas as gorjetas.':`Gorjeta de R$ ${amount.toFixed(2).replace('.',',')} registrada para cada ganhador.`;$('#modal').classList.add('show');$('#status').textContent='Corrida encerrada.';running=false;$('#start').disabled=false}
$('#start').onclick=run;$('#reload').onclick=load;$('#again').onclick=()=>{$('#modal').classList.remove('show');render();$('#status').textContent='Pilotos prontos para uma nova corrida.'};load();
</script></body></html>

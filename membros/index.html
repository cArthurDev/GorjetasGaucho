<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />

    <title>Membros | Gorjetas do Gaúcho</title>
    <link rel="icon" type="image/png" href="../images/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body class="public-page">

    <main class="join-layout">

      <div class="join-orb join-orb-one" aria-hidden="true"></div>
      <div class="join-orb join-orb-two" aria-hidden="true"></div>
      <div class="join-grid" aria-hidden="true"></div>

      <section class="join-form-panel">

        <div class="form-wrap">

          <div class="form-brand">
            <img src="../images/logo.png" alt="Gorjetas do Gaúcho" />
          </div>

          <section class="member-rules" aria-labelledby="rules-title">
            <h1 id="rules-title">Regras para participar</h1>
            <ol>
              <li><a href="https://www.twitch.tv/gauchostrean" target="_blank" rel="noopener noreferrer">Seguir na Twitch <span aria-hidden="true">↗</span></a></li>
              <li><a href="https://oibet.online/?ch=90005&amp;ic=2058125" target="_blank" rel="noopener noreferrer">Criar conta na OiBet <span aria-hidden="true">↗</span></a></li>
              <li><a href="https://chat.whatsapp.com/D2pBc27r69lLNfz3yGr9Qn?s=cl&amp;p=a&amp;mlu=4&amp;ilr=4" target="_blank" rel="noopener noreferrer">Entrar na comunidade do WhatsApp <span aria-hidden="true">↗</span></a></li>
            </ol>
          </section>

          <form id="member-form">

            <label>
              Nome completo

              <input
                name="full_name"
                type="text"
                placeholder="Digite seu nome"
                autocomplete="name"
                maxlength="120"
                required
              />
            </label>

            <label>
              Telefone

              <input
                name="phone"
                id="phone"
                type="tel"
                inputmode="numeric"
                placeholder="(64) 99999-9999"
                autocomplete="tel"
                maxlength="15"
                required
              />
            </label>

            <label>
              Nick da Twitch

              <input
                name="twitch_nick"
                type="text"
                placeholder="Digite seu nick"
                maxlength="50"
                required
              />
            </label>

            <button
              class="button button-gold"
              type="submit"
            >
              Enviar cadastro
              <span>→</span>
            </button>

          </form>

          <div
            id="form-feedback"
            class="feedback"
            role="status"
            aria-live="polite"
          ></div>

        </div>

      </section>

    </main>

    <script type="module" src="../app.js"></script>

  </body>
</html>

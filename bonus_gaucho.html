<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bônus Gaúcho</title><style>
*{box-sizing:border-box}body{margin:0;background:#07120c;color:#f7f4e9;font-family:Arial,sans-serif}.app{min-height:100vh;padding:22px;background:radial-gradient(circle at 10% 0,#547a35,transparent 30%),linear-gradient(135deg,#06100b,#112716)}.wrap{max-width:850px;margin:auto}.head,.panel{background:#0d1d14e8;border:1px solid #dec25d70;border-radius:20px;padding:22px;box-shadow:0 16px 40px #0008}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand,h1{margin:0;color:#ffdc68}.brand{font-size:25px;font-weight:900}.brand small,.muted{display:block;color:#bdcbb9;font-size:12px;margin-top:5px}.panel{margin-top:18px}h1{font-size:28px}.form,.tip{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input,select,button{height:43px;border-radius:9px;padding:0 12px;font:inherit}input,select{flex:1;min-width:130px;border:1px solid #d8be6177;background:#07130c;color:white}button{border:0;background:linear-gradient(135deg,#ffe17a,#bb7b17);color:#211702;font-weight:bold;cursor:pointer}.secondary{background:#284631;color:white}.danger{background:#552727;color:#ffdede}.entry{display:flex;gap:12px;align-items:center;padding:13px;margin:18px 0;border:1px solid #ffffff22;border-radius:12px}.entry input{max-width:145px}.list{display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #ffffff16;border-radius:10px;background:#07130c}.row div{flex:1}.row span{font-size:12px;color:#c5d0c1}.row button{height:30px;background:transparent;color:#ff9d9d;font-size:18px}.hide{display:none}.turn{text-align:center}.card{max-width:520px;margin:24px auto;padding:30px;border:2px solid #f0cd60;border-radius:20px;background:radial-gradient(circle at 50% 0,#5d813d,#14291a 65%)}.card h2{font-size:42px;margin:8px;color:white}.card strong{display:block;color:#fff0ad;font-size:25px;margin-top:8px}.rank{display:flex;align-items:center;gap:12px;padding:13px;margin:8px 0;border:1px solid #ffffff20;border-radius:10px;text-align:left}.rank:first-child{background:#4a3a10;border-color:#f3d35f}.rank b{font-size:18px;color:#ffe277}.rank div{flex:1}.prize{text-align:center;margin:20px 0;padding:18px;border:1px solid #e7c558;border-radius:14px;background:#34290f}.prize strong{display:block;font-size:38px;color:#ffe279}.feedback{min-height:18px;color:#d5e3ce;font-size:12px}@media(max-width:600px){.app{padding:12px}.head{align-items:flex-start;flex-direction:column}.tip{flex-direction:column}.tip>*{width:100%}}
</style></head><body><main class="app"><div class="wrap"><header class="head"><div class="brand">✦ BÔNUS GAÚCHO<small>Partida manual</small></div><div>Prêmio atual<br><b id="top">R$ 0,00</b></div></header>
<section id="setup" class="panel"><h1>Monte a lista</h1><p class="muted">Cadastre nick e jogo. O valor de entrada é único para todos.</p><div class="entry"><label>Entrada de cada participante</label><input id="entry" type="number" min="0" step=".01" value="0"></div><div class="form"><input id="nick" placeholder="Nick da Twitch"><input id="game" placeholder="Nome do jogo"><button id="add">Adicionar</button></div><div id="list" class="list"></div><div class="form"><button id="start">Iniciar bônus</button><button id="clear" class="danger">Limpar lista</button></div></section>
<section id="turn" class="panel turn hide"><span id="progress" class="muted"></span><h1>Quem vai comprar o bônus?</h1><div class="card"><span class="muted">PARTICIPANTE DA VEZ</span><h2 id="turnNick"></h2><b id="turnGame"></b><p class="muted">Valor que entrou</p><strong id="turnEntry"></strong></div><form id="bonusForm" class="tip"><input id="bonus" type="number" min="0" step=".01" required placeholder="Quanto pagou pelo bônus?"><button>Confirmar e próximo</button></form></section>
<section id="result" class="panel hide"><h1>Ranking final</h1><p class="muted">Quem pagou mais pelo bônus leva toda a premiação.</p><div id="ranking"></div><div class="prize">PRÊMIO DO 1º LUGAR<strong id="prize">R$ 0,00</strong><small id="details"></small></div><div class="tip"><select id="member" disabled><option>Carregando membros...</option></select><button id="give" type="button">Dar gorjeta</button></div><div id="feedback" class="feedback"></div><div class="form"><button id="again">Nova partida</button><button id="edit" class="secondary">Editar lista</button></div></section></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from './config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),cash=v=>`R$ ${Number(v||0).toFixed(2).replace('.',',')}`,esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let players=[],round=[],at=0,total=0;
function save(){localStorage.setItem('bonus-players',JSON.stringify(players));localStorage.setItem('bonus-entry',$('#entry').value)}function val(){let v=Number($('#entry').value);return Number.isFinite(v)&&v>=0?v:null}function show(x){['setup','turn','result'].forEach(n=>$('#'+n).classList.toggle('hide',n!==x))}function render(){let e=val()??0;$('#list').innerHTML=players.length?players.map((p,i)=>`<div class="row"><div><b>${esc(p.nick)}</b><span> · ${esc(p.game)}</span></div><span>${cash(e)}</span><button data-i="${i}">×</button></div>`).join(''):'<span class="muted">Nenhum participante adicionado.</span>';$('#top').textContent=cash(players.length*e)}
$('#add').onclick=()=>{let nick=$('#nick').value.trim(),game=$('#game').value.trim();if(!nick||!game)return alert('Preencha o nick e o nome do jogo.');players.push({nick,game});$('#nick').value=$('#game').value='';save();render()};$('#list').onclick=e=>{if(e.target.dataset.i!==undefined){players.splice(e.target.dataset.i,1);save();render()}};$('#entry').onchange=()=>{save();render()};
function showTurn(){let p=round[at];$('#progress').textContent=`Participante ${at+1} de ${round.length}`;$('#turnNick').textContent=p.nick;$('#turnGame').textContent=p.game;$('#turnEntry').textContent=cash(p.entry);$('#bonus').value='';$('#bonus').focus()}$('#start').onclick=()=>{let e=val();if(!players.length||e===null)return alert('Adicione participantes e informe uma entrada válida.');round=players.map(p=>({...p,entry:e,bonus:0}));at=0;show('turn');showTurn()};
$('#bonusForm').onsubmit=e=>{e.preventDefault();let b=Number($('#bonus').value);if(!Number.isFinite(b)||b<0)return;round[at++].bonus=b;at<round.length?showTurn():finish()};
function finish(){round.sort((a,b)=>b.bonus-a.bonus);let entries=round.reduce((s,p)=>s+p.entry,0),bonuses=round.reduce((s,p)=>s+p.bonus,0);total=bonuses;$('#ranking').innerHTML=round.map((p,i)=>`<div class="rank"><b>${i+1}º</b><div><strong>${esc(p.nick)}</strong><br><span>${esc(p.game)} · entrada ${cash(p.entry)}</span></div><b>${cash(p.bonus)}</b></div>`).join('');$('#prize').textContent=$('#top').textContent=cash(total);$('#details').textContent=`Total dos bônus: ${cash(bonuses)} · Entradas (não incluídas): ${cash(entries)}`;$('#give').disabled=false;$('#give').textContent='Dar gorjeta';$('#feedback').textContent='';show('result');casinoReveal();loadMembers()}
function casinoReveal(){if(!document.querySelector('#casino-effects'))document.head.insertAdjacentHTML('beforeend','<style id="casino-effects">#result{overflow:hidden;position:relative}#result:before{content:"✦ ✦ ✦ ✦ ✦";position:absolute;inset:12px 0 auto;color:#ffe47555;letter-spacing:35px;font-size:22px;animation:casinoGlow 1.2s ease-in-out infinite alternate}.rank{opacity:0;transform:translateX(-45px) scale(.92);box-shadow:0 0 0 transparent}.rank.casino-in{animation:rankIn .55s cubic-bezier(.18,.89,.32,1.28) forwards}.rank.casino-in:first-child{box-shadow:0 0 28px #ffd84b99}.prize.casino-pop{animation:potPop .8s .35s both;box-shadow:0 0 45px #ffd64c99}@keyframes rankIn{to{opacity:1;transform:translateX(0) scale(1)}}@keyframes potPop{0%{transform:scale(.65);filter:brightness(2)}65%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes casinoGlow{to{color:#fff0a6;filter:drop-shadow(0 0 12px #ffd54a)}}</style>');document.querySelectorAll('#ranking .rank').forEach((row,i)=>setTimeout(()=>row.classList.add('casino-in'),250+i*420));const pot=document.querySelector('.prize');pot.classList.remove('casino-pop');void pot.offsetWidth;pot.classList.add('casino-pop')}
$('#again').onclick=()=>{players=[];localStorage.removeItem('bonus-players');render();show('setup');$('#nick').focus()};
document.head.insertAdjacentHTML('beforeend','<style id="theme-match">body{background:#0b0b0b!important}.app{background:radial-gradient(circle at 70% 0,rgba(200,154,60,.06),transparent 31%),#111!important}.head,.panel{background:#151515!important;border-color:#302b20!important}.card{background:radial-gradient(circle at 50% 0,#302c20,#151515 65%)!important}.entry,.row,.rank,.tip-box{background:#191919!important;border-color:#302d27!important}input,select{background:#111!important;border-color:#48433a!important}.brand small,.muted,.row span{color:#8d887e!important}</style>');
document.title='Recolhe o Pote do Gaúcho';
const brandTitle=document.querySelector('.brand');if(brandTitle)brandTitle.firstChild.textContent='✦ RECOLHE O POTE DO GAÚCHO';
async function loadMembers(){let select=$('#member'),feedback=$('#feedback');select.disabled=true;feedback.textContent='Carregando membros cadastrados...';let{data,error}=await supabase.from('members').select('id,full_name,twitch_nick').order('full_name');if(error){feedback.textContent='Não foi possível carregar os membros.';return}select.innerHTML='<option value="">Selecione quem receberá a gorjeta</option>'+data.map(m=>`<option value="${m.id}">${esc(m.full_name)}${m.twitch_nick?' — @'+esc(m.twitch_nick):''}</option>`).join('');select.disabled=!data.length;feedback.textContent=data.length?'':'Nenhum membro cadastrado encontrado.'}
$('#give').onclick=async()=>{let id=$('#member').value,button=$('#give'),feedback=$('#feedback');if(!id)return feedback.textContent='Selecione o membro que receberá a gorjeta.';button.disabled=true;feedback.textContent='Registrando gorjeta...';let{error}=await supabase.from('tips').insert({member_id:id,amount:total,source:'members'});if(error){feedback.textContent='Não foi possível registrar: '+error.message;button.disabled=false;return}feedback.textContent=`Gorjeta de ${cash(total)} registrada com sucesso.`;button.textContent='Gorjeta enviada'};$('#again').onclick=()=>$('#start').click();$('#edit').onclick=()=>{render();show('setup')};$('#clear').onclick=()=>{if(confirm('Remover todos os participantes?')){players=[];save();render()}};try{players=JSON.parse(localStorage.getItem('bonus-players'))||[];$('#entry').value=localStorage.getItem('bonus-entry')||'0'}catch{}render();
</script></body></html>
